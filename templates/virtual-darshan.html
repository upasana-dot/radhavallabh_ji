<!DOCTYPE html>
<html>
<head>
    <title>360° Virtual Darshan</title>

    <!-- Pannellum CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <link rel="stylesheet" href="static/css/virtual-darshan.css">

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #fffaf0;
        }

        h2 {
            text-align: center;
            padding: 20px;
            color: #7a1f1f;
        }

        #panorama {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
<h2 class="h2">🌸 360° Virtual Darshan 🌸</h2>
<nav class="navbar">
    <a href="/home">Home</a>
    <a href="/about">About</a>
    <a href="/darshan">Darshan</a>
    <a href="/events">Events</a>
    <a href="/gallery">Gallery</a>
    <a href="/contact">Contact</a>
    <a href="/calendar">Calendar</a>
    <a href="/book">Books</a>
    <a href="/virtual-darshan">Virtual Darshan</a>
</nav>

<div id="panorama"></div>

<!-- Pannellum JS -->
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>


<script>
pannellum.viewer('panorama', {
    "type": "equirectangular",
    "panorama": "Images/temple360.jpg",
    "autoLoad": true,
    "autoRotate": -2,
    "showControls": true
});



</script>

</body>
</html>
