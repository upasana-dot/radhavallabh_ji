<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Events Calendar</title>
    <link rel="stylesheet" href="static/css/calendar.css">
</head>
<body>

<header class="calendar-header">
    <h1>🗓️ Temple Events Calendar</h1>
    <p>Shri Radha Vallabh Temple</p>
</header>

<!-- NAVIGATION -->
<nav class="navbar">
    <a href="/home">Home</a>
    <a href="/about">About</a>
    <a href="/darshan">Darshan</a>
    <a href="/events">Events</a>
    <a href="/gallery">Gallery</a>
    <a href="/contact">Contact</a>
    <a href="/calendar">Calendar</a>
    <a href="/book">Books</a>
    <a href="/virtual-darshan">Virtual Darshan</a>
</nav>


<!-- CONTROLS -->
<div class="calendar-controls">
    <button onclick="prevMonth()">❮</button>
    <h2 id="monthYear"></h2>
    <button onclick="nextMonth()">❯</button>
</div>

<!-- CALENDAR -->
<div class="calendar-container">
    <div class="calendar-grid day-names">
        <div>Sun</div><div>Mon</div><div>Tue</div>
        <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div class="calendar-grid dates" id="calendarDates"></div>
</div>

<script src="static/js/calendar.js"></script>
</body>
</html>
